name: CI Quality Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install backend dependencies and build
        run: |
          npm ci
          npm run build
        working-directory: backend

      - name: Install frontend dependencies and build
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Start backend
        run: |
          Start-Process node -ArgumentList "dist/server.js" -WorkingDirectory "backend" -RedirectStandardOutput "backend.log"
          Start-Sleep -Seconds 2
        shell: pwsh

      - name: Run API contract tests and Selenium journeys
        run: mvn -q test
        working-directory: tests

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tests/target/surefire-reports

  # Every merge to master is gated behind build-and-test succeeding: branch protection on
  # this repository requires the build-and-test check to pass before a pull request can be
  # merged. This job exists only as a single named required-status-check target.
  merge-gate:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - run: echo "build-and-test passed, merge is allowed"
